name: Build Android APK

'on':
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install \
            "platforms;android-36.1" \
            "build-tools;36.0.0"

      - name: Restore original debug keystore
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$DEBUG_KEYSTORE_BASE64" ]; then
            echo "ERROR: DEBUG_KEYSTORE_BASE64 secret is missing."
            exit 1
          fi

          printf '%s' "$DEBUG_KEYSTORE_BASE64" \
            | tr -d '\r\n ' \
            | base64 --decode > debug.keystore

          test -s debug.keystore

          keytool -list -v \
            -keystore debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            > "$RUNNER_TEMP/keystore-info.txt"

          if ! grep -qi \
            "b0:81:d0:e1:40:79:77:99:ea:c9:8d:5e:25:1b:13:da:5d:7f:fe:5e" \
            "$RUNNER_TEMP/keystore-info.txt"; then
            echo "ERROR: Keystore SHA-1 does not match Firebase."
            exit 1
          fi

          echo "Original signing key verified successfully."

      - name: Install Gradle if wrapper is missing
        run: |
          if [ ! -f ./gradlew ]; then
            curl -fL \
              https://services.gradle.org/distributions/gradle-9.3.1-bin.zip \
              -o "$RUNNER_TEMP/gradle.zip"

            unzip -q "$RUNNER_TEMP/gradle.zip" \
              -d "$RUNNER_TEMP"

            echo "$RUNNER_TEMP/gradle-9.3.1/bin" >> "$GITHUB_PATH"
          fi

      - name: Build APK
        run: |
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew :app:assembleDebug --no-daemon
          else
            gradle :app:assembleDebug --no-daemon
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: aljasoos-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
